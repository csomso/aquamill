<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aquamill</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1622; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      .panel {
        position: fixed; top: 16px; right: 16px; width: 220px; padding: 12px 14px;
        background: rgba(0, 0, 0, 0.55); color: #fff; border-radius: 8px;
        font: 13px system-ui, sans-serif;
      }
      .panel h2 { margin: 0 0 8px; font-size: 14px; }
      .panel label { display: block; margin-bottom: 10px; }
      .panel output { float: right; color: #ffb347; }
      .panel input[type=range] { width: 100%; margin-top: 4px; }
      .panel button { width: 100%; padding: 6px; margin-top: 4px; cursor: pointer; }
      .panel .hint { margin: 6px 0 0; color: rgba(255, 255, 255, 0.6); font-size: 12px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
